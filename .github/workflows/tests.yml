name: Tests

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Bash and PowerShell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bash regression tests
        run: bash tests/ssh-manager-linux.sh
      - name: Linux installer tests
        run: bash tests/install-linux.sh
      - name: PowerShell regression tests
        shell: pwsh
        run: ./tests/SSH-Manager.Tests.ps1
      - name: PowerShell global launcher and updater regression tests
        shell: pwsh
        run: ./tests/GlobalCommand.Tests.ps1
