name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (for example v0.4.0)
        required: true
        type: string

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): publish v0.4.0') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test Bash
        run: bash tests/ssh-manager-linux.sh
      - name: Test Linux installer
        run: bash tests/install-linux.sh
      - name: Test PowerShell
        shell: pwsh
        run: ./tests/SSH-Manager.Tests.ps1
      - name: Test PowerShell global launcher and updater
        shell: pwsh
        run: ./tests/GlobalCommand.Tests.ps1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.4.0' }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          SSH Manager v0.4.0 lets you run local Bash scripts on saved SSH targets from either the PowerShell or Bash manager.

          - Choose **O → R** to select a script and then the server where it should run.
          - Store scripts in `~/.ssh/ssh-manager/scripts/user/` to run them as the SSH user, or in `~/.ssh/ssh-manager/scripts/root/` to run them as root. The terminal remains available for sudo and script prompts.
          - Choose **O → D** to open a local shell in the scripts directory. Edit your scripts there and type `exit` to return to the manager.

          [Changes since v0.3.7](https://github.com/eb-88/SSH-Manager/compare/v0.3.7...v0.4.0)
          NOTES
          )
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SSH Manager $TAG" \
            --notes "$notes"
