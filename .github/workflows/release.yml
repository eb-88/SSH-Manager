name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (for example v0.3.1)
        required: true
        type: string

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): publish v0.3.1') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test Bash
        run: bash tests/ssh-manager-linux.sh
      - name: Test Linux installer
        run: bash tests/install-linux.sh
      - name: Test PowerShell
        shell: pwsh
        run: ./tests/SSH-Manager.Tests.ps1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.3.1' }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          SSH Manager v0.3.1 improves repeat installations on Linux and PowerShell.

          - Running the installer again detects an existing installation and offers to update it.
          - Declining an update preserves the existing installation without changes.
          - Updates use Git fast-forward pulls and stop safely if the checkout is not valid.
          - Linux refreshes the installed command after a successful update.
          - SSH targets and keys are preserved.
          - Added Linux installer regression tests alongside existing Bash and PowerShell tests.

          [Changes since v0.3.0](https://github.com/eb-88/SSH-Manager/compare/v0.3.0...v0.3.1)
          NOTES
          )
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SSH Manager $TAG" \
            --notes "$notes"
