name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (for example v0.3.0)
        required: true
        type: string

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): publish v0.3.0') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test Bash
        run: bash tests/ssh-manager-linux.sh
      - name: Test PowerShell
        shell: pwsh
        run: ./tests/SSH-Manager.Tests.ps1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.3.0' }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          SSH Manager v0.3.0 adds an opt-in self-update flow to PowerShell and Bash.

          - Check the latest stable GitHub release on each launch.
          - Show a German or English installation prompt when a newer version is available.
          - Install updates only after approval; use the new version on the next launch.
          - Preserve saved SSH targets and keys; keep running if GitHub is unavailable.
          - Validate downloaded scripts before replacing the local executable.
          - Extend Bash and PowerShell regression tests for version checks and update handling.

          [Changes since v0.2.0](https://github.com/eb-88/SSH-Manager/compare/v0.2.0...v0.3.0)
          NOTES
          )
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SSH Manager $TAG" \
            --notes "$notes"
