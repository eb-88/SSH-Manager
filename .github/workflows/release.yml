name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (for example v0.3.7)
        required: true
        type: string

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): publish v0.3.7') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test Bash
        run: bash tests/ssh-manager-linux.sh
      - name: Test Linux installer
        run: bash tests/install-linux.sh
      - name: Test PowerShell
        shell: pwsh
        run: ./tests/SSH-Manager.Tests.ps1
      - name: Test PowerShell global launcher and updater
        shell: pwsh
        run: ./tests/GlobalCommand.Tests.ps1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.3.7' }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          SSH Manager v0.3.7 fixes SSHM/sshm shortcuts after updating on Windows and Linux.

          - PowerShell: make the SSHM shortcut available immediately in the current session after updating.
          - PowerShell: keep the launcher module persistent for new sessions without re-importing the running module.
          - Linux: automatically create missing sshm and SSHM launchers after in-app self-updates.
          - Preserve existing commands and never overwrite unrelated shortcuts.
          - Add upgrade regression tests for Linux and Windows PowerShell 5.1/7.

          [Changes since v0.3.6](https://github.com/eb-88/SSH-Manager/compare/v0.3.6...v0.3.7)
          NOTES
          )
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SSH Manager $TAG" \
            --notes "$notes"
