name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (for example v0.3.6)
        required: true
        type: string

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): publish v0.3.6') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test Bash
        run: bash tests/ssh-manager-linux.sh
      - name: Test Linux installer
        run: bash tests/install-linux.sh
      - name: Test PowerShell
        shell: pwsh
        run: ./tests/SSH-Manager.Tests.ps1
      - name: Test PowerShell global launcher and updater
        shell: pwsh
        run: ./tests/GlobalCommand.Tests.ps1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.3.6' }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          SSH Manager v0.3.6 adds the SSHM/sshm short commands.

          - Start SSH Manager using SSHM or sshm in PowerShell, alongside SSH-Manager.
          - Launch from sshm or SSHM on Linux, alongside ssh-manager.
          - Automatically extend existing PowerShell launcher modules with the short command.
          - Keep existing commands intact and protect unrelated command names.
          - Add installation, migration and launcher regression tests plus German and English documentation.

          [Changes since v0.3.5](https://github.com/eb-88/SSH-Manager/compare/v0.3.5...v0.3.6)
          NOTES
          )
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SSH Manager $TAG" \
            --notes "$notes"
