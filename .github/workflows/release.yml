name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (for example v0.3.5)
        required: true
        type: string

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): publish v0.3.5') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test Bash
        run: bash tests/ssh-manager-linux.sh
      - name: Test Linux installer
        run: bash tests/install-linux.sh
      - name: Test PowerShell
        shell: pwsh
        run: ./tests/SSH-Manager.Tests.ps1
      - name: Test PowerShell global launcher and updater
        shell: pwsh
        run: ./tests/GlobalCommand.Tests.ps1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.3.5' }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          SSH Manager v0.3.5 adds configurable automatic updates and manual update checks.

          - Disable or re-enable automatic update checks at startup in Options (O -> A).
          - Check for updates manually and install an available release at any time (O -> U).
          - Automatic checks stay enabled by default and the preference persists across launches.
          - Share the preference between PowerShell and Bash when using the same home directory.
          - Provide German and English labels, no-update feedback, tests and documentation.

          [Changes since v0.3.4](https://github.com/eb-88/SSH-Manager/compare/v0.3.4...v0.3.5)
          NOTES
          )
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SSH Manager $TAG" \
            --notes "$notes"
