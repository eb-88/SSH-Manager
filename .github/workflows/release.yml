name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (for example v0.3.3)
        required: true
        type: string

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): publish v0.3.3') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test Bash
        run: bash tests/ssh-manager-linux.sh
      - name: Test Linux installer
        run: bash tests/install-linux.sh
      - name: Test PowerShell
        shell: pwsh
        run: ./tests/SSH-Manager.Tests.ps1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.3.3' }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          SSH Manager v0.3.3 adds live full-text search for SSH targets.

          - Update matching targets instantly as each character is typed in PowerShell and Bash.
          - Search case-insensitively by name, hostname, user, port and login method.
          - Match multiple words across different target fields.
          - Support Enter to apply, Esc to cancel and Backspace to edit the search.
          - Keep non-interactive search input compatible and update German/English documentation.
          - Expand PowerShell and Linux regression tests.

          [Changes since v0.3.2](https://github.com/eb-88/SSH-Manager/compare/v0.3.2...v0.3.3)
          NOTES
          )
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SSH Manager $TAG" \
            --notes "$notes"
