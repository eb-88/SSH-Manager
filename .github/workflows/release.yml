name: Publish release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (for example v0.3.2)
        required: true
        type: string

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): publish v0.3.2') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test Bash
        run: bash tests/ssh-manager-linux.sh
      - name: Test Linux installer
        run: bash tests/install-linux.sh
      - name: Test PowerShell
        shell: pwsh
        run: ./tests/SSH-Manager.Tests.ps1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.3.2' }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          SSH Manager v0.3.2 displays the installed version and warns about available updates.

          - Show the currently installed version in the main menu on Bash and PowerShell.
          - Keep a visible, localized outdated-version notice when a newer release is declined.
          - Show the notice if an attempted update fails; clear it after a successful update.
          - Keep startup usable offline and preserve saved SSH targets and keys.
          - Add regression tests for the version indicator and update status in English and German.

          [Changes since v0.3.1](https://github.com/eb-88/SSH-Manager/compare/v0.3.1...v0.3.2)
          NOTES
          )
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SSH Manager $TAG" \
            --notes "$notes"
